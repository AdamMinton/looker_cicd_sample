name: Deploy to Dev Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Trigger Looker Deploy Webhook
        env:
          DEV_LOOKERSDK_BASE_URL: ${{ secrets.DEV_LOOKERSDK_BASE_URL }}
        run: |
          if [ -z "$DEV_LOOKERSDK_BASE_URL" ]; then
            echo "Error: DEV_LOOKERSDK_BASE_URL is not set"
            exit 1
          fi
          
          # Trigger deploy webhook to pull master changes into production mode
          webhook_url="${DEV_LOOKERSDK_BASE_URL}/webhooks/projects/looker_cicd_sample/deploy"
          echo "Triggering Looker Deploy Webhook: POST $webhook_url"
          
          resp=$(curl -s -w "\n%{http_code}" -X POST "$webhook_url")
          http_code=$(echo "$resp" | tail -n 1)
          body=$(echo "$resp" | head -n -1)
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -gt 299 ]; then
            echo "Error: Deploy webhook failed (HTTP $http_code)"
            echo "Details: $body"
            exit 1
          fi
          echo "Deployment successful: $body"
